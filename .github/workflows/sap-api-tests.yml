name: SAP API & Database Automated Tests

on:
  push:
    paths:
      - 'Project_Api_Sql_Sap/**'
      - '.github/workflows/sap-api-tests.yml'
  pull_request:
    paths:
      - 'Project_Api_Sql_Sap/**'
      - '.github/workflows/sap-api-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Run Pytest Suite & Database Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r Project_Api_Sql_Sap/requirements.txt

      - name: Start FastAPI Backend in Background
        run: |
          cd Project_Api_Sql_Sap/backend
          nohup uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 3

      - name: Healthcheck Backend Server
        run: |
          curl --retry 5 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/ || (cat Project_Api_Sql_Sap/backend/uvicorn.log && exit 1)

      - name: Run Pytest Regression Suite with HTML Report
        run: |
          python -m pytest Project_Api_Sql_Sap/tests/ -v --html=Project_Api_Sql_Sap/reports/report.html --self-contained-html

      - name: Upload Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sap-test-report
          path: Project_Api_Sql_Sap/reports/report.html

